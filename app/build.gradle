plugins {
    id("com.android.application")
    id 'org.jetbrains.kotlin.plugin.compose'
    id("com.google.dagger.hilt.android")
    id("com.google.devtools.ksp")
}

android {
    namespace 'gerard.example.munchkinhelper'
    compileSdk 37

    defaultConfig {
        applicationId "gerard.example.munchkinhelper"
        minSdk 24
        targetSdk 37
        versionCode 10302
        versionName "3.0.2"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    buildFeatures {
        compose true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.2.0'
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {

    implementation 'androidx.core:core-ktx:1.19.0'
    implementation "org.jetbrains.kotlin:kotlin-reflect:$kotlin_version"
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.11.0'
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation "androidx.compose.ui:ui:$compose_version"
    implementation "androidx.compose.ui:ui-tooling-preview:$compose_version"
    implementation 'androidx.compose.material3:material3:1.4.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation "androidx.compose.ui:ui-test-junit4:$compose_version"
    debugImplementation "androidx.compose.ui:ui-tooling:$compose_version"
    debugImplementation "androidx.compose.ui:ui-test-manifest:$compose_version"
    implementation 'androidx.core:core-splashscreen:1.2.0'
    implementation("androidx.compose.material:material:1.12.0")

    // font
    implementation "androidx.compose.ui:ui-text-google-fonts:1.12.0"

    // coil
    implementation "io.coil-kt:coil-compose:$coil_version"
    implementation "io.coil-kt:coil-gif:$coil_version"

    // navigation
    implementation "androidx.navigation:navigation-compose:$nav_version"

    // hilt
    implementation "com.google.dagger:hilt-android:$hilt_version"
    implementation("androidx.hilt:hilt-navigation-compose:1.4.0")
    ksp("com.google.dagger:hilt-android-compiler:$hilt_version")

    // Lottie
    implementation "com.airbnb.android:lottie-compose:$lottie_version"

    // Data store
    implementation("androidx.datastore:datastore-preferences:$data_store")

    // Gson
    implementation "com.google.code.gson:gson:$gson"

    // konfetti
    implementation 'nl.dionsegijn:konfetti-compose:2.0.5'

    // leak canary
    debugImplementation 'com.squareup.leakcanary:leakcanary-android:2.14'
}